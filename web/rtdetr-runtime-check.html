<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>RT-DETR ブラウザ実行検証</title><link rel="stylesheet" href="standalone-trainer.css"><main><h1>RT-DETR ブラウザ実行検証</h1><p>推論ランタイムの検証専用。学習やDQ9認識精度の合格を意味しません。モデルと入力はブラウザ内だけで使用し、外部送信しません。</p><label>確認済み候補 model.onnx<input id="model" type="file" accept=".onnx"></label><label>前処理済み float32 NCHW 640×640入力<input id="pixels" type="file" accept=".f32,.bin"></label><button id="wasm">WASM CPUで検証</button><button id="webgpu">WebGPU優先で検証</button><button id="download" disabled>出力テンソルを保存</button><p>WebGPU優先では未対応演算のWASM fallbackを許容します。実行成功だけで全演算GPU実行とは主張しません。各方式で同じ入力を3回推論します。</p><p id="status" role="status">未実行</p><pre id="report"></pre></main><script type="module" src="rtdetr-runtime-check.mjs"></script></html>
