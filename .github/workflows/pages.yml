name: Build and deploy map miner
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'wasm/**'
      - 'scripts/build.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install WebAssembly linker
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang-18 lld-18
      - name: Build production WebAssembly
        env:
          CLANG: clang-18
          WASM_LD: /usr/bin/wasm-ld-18
        run: bash scripts/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
