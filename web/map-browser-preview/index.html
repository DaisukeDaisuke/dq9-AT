<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DQ9 マップ背景プレビュー</title>
<style>body{font:15px system-ui;background:#15181b;color:#eee;margin:20px}button,select,input{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}label{display:block;margin:12px 0}select{width:min(650px,100%)}.panels{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}.panel{max-width:100%}canvas{image-rendering:pixelated;max-width:100%;height:auto;background:repeating-conic-gradient(#222 0% 25%,#282828 0% 50%) 0/16px 16px}#minimap{width:672px;cursor:crosshair;touch-action:manipulation}#view{width:768px}#status{white-space:pre-wrap;overflow-wrap:anywhere}details{max-width:1000px}pre{white-space:pre-wrap}small{color:#ccc}.warning{color:#ffc981}</style>
<h1>マップを選んで、地図をクリック</h1><p>ROMから配置・テクスチャ・初期カメラを読み込み、CPU / Canvas2Dで背景を描きます。ROMはブラウザ内で処理します。JSONの手入力は不要です。</p>
<p class="warning">開発中：初期姿勢のプレビューです。ゲーム進行・時刻による色、カメラ変更、霧などはまだ一致確認できていません。全マップ対応・実動画との背景差分の完成版ではありません。</p>
<label>ROMを選択 <input id="rom" type="file" accept=".nds"></label><label>マップ名で検索 <input id="search" type="search" placeholder="例：絶望と憎悪の魔宮" disabled></label><label>マップ <select id="map" disabled></select></label><label>地図画像 <select id="descriptor" disabled></select></label>
<div class="panels"><section class="panel"><h2>大きな地図</h2><p id="mapstatus">ROMを選択してください。</p><canvas id="minimap" width="224" height="256" aria-label="クリックして描画地点を選ぶ地図"></canvas></section><section class="panel"><h2>背景（CPU描画）</h2><canvas id="view" width="256" height="192" aria-label="選択地点の背景"></canvas><label>向き <input id="yaw" type="range" min="0" max="359" step="1" value="0"><output id="yawlabel">0°</output></label><label>床の候補 <select id="floor" disabled></select></label><button id="draw" disabled>再描画</button><p id="status" role="status">地図上の地点を選択すると描画します。</p></section></div><details><summary>描画状態・未対応箇所</summary><pre id="diagnostics"></pre></details><script type="module" src="./preview.mjs?v=rom-only-cpu-2"></script></html>
