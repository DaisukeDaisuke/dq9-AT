name: Build and deploy map miner
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'wasm/**'
      - 'scripts/build.sh'
      - 'scripts/test-monster-proposal-accounting.mjs'
      - 'scripts/test-monster-recognize-page.mjs'
      - 'scripts/test-at-source.mjs'
      - 'scripts/test-at-worker-regressions.mjs'
      - 'scripts/at-identify-regression-node-worker.mjs'
      - 'scripts/test-at-binary64-regressions.mjs'
      - 'scripts/at-identify-node-worker.mjs'
      - 'scripts/at-identify-index-node-worker.mjs'
      - 'scripts/fixtures/at-ieee754-reference.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Install WebAssembly toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang lld
      - name: Build production WebAssembly
        run: bash scripts/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
